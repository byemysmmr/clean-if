<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메타데이터 삭제</title>
<meta name="description" content="@aksdifr">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;}
  button,input,select{font-family:inherit;}
  [hidden]{display:none!important;}
  .fld{display:flex;flex-direction:column;min-width:0;}
  .fld.full{grid-column:1/-1;}
  .mid{flex:1;min-width:0;}
  .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acts{display:flex;gap:6px;flex:none;}
  .seg{display:flex;}
  .seg button{flex:1 1 0;cursor:pointer;}
  .rangerow{display:flex;align-items:center;gap:10px;}
  .rangerow input[type=range]{flex:1;}
  .chk{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .list{display:flex;flex-direction:column;}
  .row{display:flex;align-items:center;}
  .tags{display:flex;flex-wrap:wrap;}
  .bar{display:flex;justify-content:flex-end;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn[disabled],.mini[disabled]{opacity:.35;pointer-events:none;}

  :root{
    --ui:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --bg:#f1f1f1; --panel:#ffffff; --panel-2:#fafafa; --panel-3:#f2f2f2;
    --line:#e2e2e2; --line-2:#d2d2d2;
    --ink:#2b2b2b; --ink-2:#6e6e6e; --ink-3:#a8a8a8;
    --solid:#2b2b2b;
  }
  body{font-family:var(--ui);background:var(--bg);color:var(--ink);line-height:1.6;
    letter-spacing:-.005em;-webkit-font-smoothing:antialiased;padding:56px 20px 80px;font-size:12px;}
  ::selection{background:#2b2b2b;color:#fff;}
  .wrap{max-width:960px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:34px 36px 36px;}
  .head{margin:0 0 4px;}
  .head h1{font-size:12px;font-weight:700;letter-spacing:0;margin:0;color:var(--ink);}
  .card .head{display:none;}
  .rule{display:block;height:1px;background:var(--solid);margin:10px 0 26px;}

  .drop{border:1px dashed var(--line-2);padding:46px 16px;text-align:center;
    background:var(--panel-2);cursor:pointer;transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--ink-2);background:var(--panel-3);}
  .drop b{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .drop span{font-size:11px;color:var(--ink-3);letter-spacing:.01em;}

  .opts{display:grid;grid-template-columns:1fr;gap:0;margin-top:26px;
    border-top:1px solid var(--line);}
  .opts>.fld{padding:13px 2px;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:0 16px;}
  .opts>.fld>.lab{margin:0;}
  .lab{font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin:0 0 7px;}

  select,input[type=number]{width:100%;height:30px;padding:0 9px;background:var(--panel);
    border:1px solid var(--line-2);color:var(--ink);border-radius:0;font-size:12px;}
  select:focus,input:focus{border-color:var(--ink-2);outline:none;}

  .seg{border:1px solid var(--line-2);width:max-content;max-width:100%;}
  .seg button{border:none;background:var(--panel);padding:6px 18px;font-size:11.5px;
    color:var(--ink-3);letter-spacing:.01em;min-width:72px;white-space:nowrap;}
  .seg button+button{border-left:1px solid var(--line-2);}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--solid);color:#fff;font-weight:500;}
  .rangerow input[type=range]{accent-color:var(--solid);}
  .rangerow b{font-size:11.5px;color:var(--ink-2);min-width:40px;text-align:right;font-weight:500;}
  .chk{font-size:11.5px;color:var(--ink-2);}
  .chk input{accent-color:var(--solid);width:14px;height:14px;}

  .list{margin-top:30px;gap:0;}
  .list:empty{display:none;}
  .empty{text-align:center;color:var(--ink-3);font-size:11px;padding:30px 0;}
  .row{gap:16px;padding:16px 2px;border-bottom:1px solid var(--line);}
  .row:first-child{border-top:1px solid var(--line);}
  .thumb{width:44px;height:44px;flex:none;border-radius:0;object-fit:cover;
    background:var(--panel-3);border:1px solid var(--line);}
  .nm{font-size:12px;font-weight:600;color:var(--ink);}
  .sz{font-size:11px;color:var(--ink-3);margin-top:2px;}
  .sz i{color:var(--ink-2);font-style:normal;margin:0 5px;}
  .tags{gap:5px;margin-top:7px;}
  .tag{font-size:10px;font-weight:400;padding:1px 6px;border-radius:0;
    background:transparent;border:1px solid var(--line-2);color:var(--ink-2);letter-spacing:0;}
  .tag.none{color:var(--ink-3);border-color:var(--line);}
  .state{font-size:10px;font-weight:500;padding:2px 8px;border-radius:0;flex:none;
    letter-spacing:.02em;border:1px solid transparent;}
  .s-wait{color:var(--ink-3);border-color:var(--line);}
  .s-work{color:var(--ink-2);border-color:var(--line-2);}
  .s-done{color:var(--ink);border-color:var(--ink);}
  .s-fail{color:#8a8a8a;border-color:#8a8a8a;text-decoration:line-through;}

  .btn{border-radius:0;font-size:11.5px;font-weight:500;height:32px;padding:0 20px;
    border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);}
  .btn:hover{border-color:var(--ink-2);color:var(--ink);}
  .go{background:var(--solid);color:#fff;border-color:var(--solid);}
  .go:hover{background:#000;border-color:#000;color:#fff;}
  .sub{background:var(--panel);}
  .mini{height:24px;padding:0 10px;font-size:10.5px;background:transparent;
    border:1px solid var(--line);color:var(--ink-3);border-radius:0;cursor:pointer;}
  .mini:hover{border-color:var(--ink-2);color:var(--ink);}
  .bar{gap:8px;margin-top:26px;}
  .note{font-size:11px;color:var(--ink-3);line-height:1.9;margin-top:34px;padding-top:16px;
    border-top:1px solid var(--line);}
  .note b{color:var(--ink-2);font-weight:500;}
  @media (max-width:560px){
    body{padding:28px 14px 60px;}
    .card{padding:22px 18px 24px;}
    .opts>.fld{grid-template-columns:1fr;gap:7px 0;align-items:stretch;}
    .seg{width:auto;} .seg button{min-width:0;padding:6px 10px;}
    .row{flex-wrap:wrap;} .mid{flex:1 0 100%;order:3;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>메타데이터 삭제</h1>
  </div>
  <i class="rule"></i>

  <div class="card">
    <div class="drop" id="drop">
      <b>클릭하거나 이미지를 끌어다 놓으세요</b>
      <span>PNG · JPG · WebP · 여러 장 한꺼번에</span>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    </div>

    <div class="opts">
      <div class="fld">
        <div class="lab">저장 형식</div>
        <div class="seg" id="segFmt">
          <button type="button" data-v="png" aria-pressed="true">PNG</button>
          <button type="button" data-v="jpg" aria-pressed="false">JPG</button>
          <button type="button" data-v="webp" aria-pressed="false">WebP</button>
        </div>
      </div>

      <div class="fld" id="qFld" style="display:none">
        <div class="lab">품질</div>
        <div class="rangerow">
          <input id="q" type="range" min="50" max="100" step="1" value="92">
          <b id="qv">92%</b>
        </div>
      </div>

      <div class="fld">
        <div class="lab">투명한 부분</div>
        <div class="seg" id="segAlpha">
          <button type="button" data-v="flat" aria-pressed="true">흰색으로 채우기</button>
          <button type="button" data-v="keep" aria-pressed="false">그대로 두기</button>
        </div>
      </div>

      <div class="fld">
        <div class="lab">크기 줄이기</div>
        <label class="chk" style="height:36px">
          <input type="checkbox" id="doResize">
          <span>긴 변을 <input type="number" id="maxSide" value="1600" min="200" max="8000" step="100"
            style="width:72px;height:26px;display:inline-block;vertical-align:middle;margin:0 2px"> px 까지</span>
        </label>
      </div>
    </div>

    <div class="list" id="list">
      <div class="empty" id="empty">아직 올린 이미지가 없습니다</div>
    </div>

    <div class="bar">
      <button class="btn sub" id="clear" disabled>전체 비우기</button>
      <button class="btn sub" id="dlzip" disabled>ZIP으로 받기</button>
      <button class="btn go" id="go" disabled>지우기</button>
    </div>

    <p class="note" id="note">
      모든 처리는 이 브라우저 안에서만<br>
      <b>흰색으로 채우기</b>를 고르면 투명한 부분이 흰색이 되는 대신 투명 영역에 숨겨둔 기록까지 사라짐...
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };
var drop=$('drop'), file=$('file'), list=$('list'), empty=$('empty');

var opt={ fmt:'png', alpha:'flat' };
var items=[], seq=0;

/* ===================== 설정 ===================== */
[['segFmt','fmt'],['segAlpha','alpha']].forEach(function(p){
  var seg=$(p[0]);
  seg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      seg.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      opt[p[1]]=b.getAttribute('data-v');
      sync();
    });
  });
});
$('q').addEventListener('input', function(){ $('qv').textContent=$('q').value+'%'; });
$('doResize').addEventListener('change', sync);

function sync(){
  $('qFld').style.display = (opt.fmt==='png') ? 'none' : '';
  var has=items.length>0;
  $('clear').disabled=!has;
  $('go').disabled=!items.some(function(x){ return x.state!=='done'; });
  $('dlzip').disabled=!items.some(function(x){ return x.state==='done'; });
  empty.style.display=has?'none':'';
  // JPG 는 투명을 못 담는다
  var jpg=(opt.fmt==='jpg');
  $('segAlpha').querySelectorAll('button').forEach(function(b){
    b.disabled = jpg && b.getAttribute('data-v')==='keep';
    b.style.opacity = b.disabled ? '.4' : '';
  });
  if(jpg && opt.alpha==='keep'){
    opt.alpha='flat';
    $('segAlpha').querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-v')==='flat' ? 'true':'false');
    });
  }
}

function txt(u,s,n){ var o=''; for(var i=s;i<s+n && i<u.length;i++) o+=String.fromCharCode(u[i]); return o; }

function sniff(buf){
  var u=new Uint8Array(buf), dv=new DataView(buf);
  var out={ type:'', found:[], alpha:false };
  function add(x){ if(x && out.found.indexOf(x)===-1) out.found.push(x); }

  // PNG
  if(u[0]===0x89 && txt(u,1,3)==='PNG'){
    out.type='PNG';
    var p=8;
    while(p+8<=u.length){
      var len=dv.getUint32(p), t=txt(u,p+4,4);
      if(len<0 || p+12+len>u.length+12) break;
      if(t==='IHDR'){ var ct=u[p+8+9]; out.alpha=(ct===4||ct===6); }
      else if(t==='tEXt'||t==='zTXt'||t==='iTXt'){
        var s=p+8, e=s;
        while(e<s+len && u[e]!==0) e++;
        add(txt(u,s,e-s) || '텍스트');
      }
      else if(t==='eXIf') add('EXIF');
      else if(t==='tIME') add('수정 시각');
      else if(t==='IEND') break;
      p+=12+len;
    }
    return out;
  }

  // JPEG
  if(u[0]===0xFF && u[1]===0xD8){
    out.type='JPEG';
    var p2=2;
    while(p2+4<u.length && u[p2]===0xFF){
      var m=u[p2+1];
      if(m===0x01 || (m>=0xD0 && m<=0xD9)){ p2+=2; continue; }
      if(m===0xDA) break;
      var l=(u[p2+2]<<8)|u[p2+3];
      if(l<2) break;
      if(m===0xE0) add('JFIF');
      else if(m===0xE1){
        var tag=txt(u,p2+4,5);
        if(tag.indexOf('Exif')===0) add('EXIF');
        else if(tag.indexOf('http')===0) add('XMP');
        else add('APP1');
      }
      else if(m===0xE2) add('색 프로파일');
      else if(m===0xED) add('IPTC');
      else if(m===0xEE) add('Adobe');
      else if(m===0xFE) add('주석');
      p2+=2+l;
    }
    return out;
  }

  // WebP
  if(txt(u,0,4)==='RIFF' && txt(u,8,4)==='WEBP'){
    out.type='WebP';
    var p3=12;
    while(p3+8<=u.length){
      var c=txt(u,p3,4), cl=dv.getUint32(p3+4,true);
      if(c==='EXIF') add('EXIF');
      else if(c==='XMP ') add('XMP');
      else if(c==='ALPH') out.alpha=true;
      else if(c==='VP8L') out.alpha=true;
      p3+=8+cl+(cl&1);
      if(cl<0) break;
    }
    return out;
  }

  out.type='알 수 없음';
  return out;
}

/* ===================== 목록 ===================== */
function size(b){
  return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(2)+' MB';
}
function add(files){
  var n=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(!f.type || f.type.indexOf('image/')!==0) continue;
    var it={ id:++seq, file:f, url:URL.createObjectURL(f), state:'wait', blob:null, out:'', outSize:0, info:null };
    items.push(it); draw(it); read(it); n++;
  }
  if(n) sync();
}
function read(it){
  var r=new FileReader();
  r.onload=function(){
    try{ it.info=sniff(r.result); }catch(e){ it.info={type:'',found:[],alpha:false}; }
    paint(it);
  };
  r.onerror=function(){ paint(it); };
  r.readAsArrayBuffer(it.file);
}
function draw(it){
  var d=document.createElement('div');
  d.className='row'; d.id='row'+it.id;
  d.innerHTML='<img class="thumb" alt=""><div class="mid">'+
    '<div class="nm"></div><div class="sz"></div><div class="tags"></div></div>'+
    '<span class="state s-wait">대기</span>'+
    '<div class="acts"><button class="mini" data-dl disabled>받기</button>'+
    '<button class="mini" data-rm>삭제</button></div>';
  d.querySelector('.thumb').src=it.url;
  d.querySelector('.nm').textContent=it.file.name;
  d.querySelector('.sz').textContent=size(it.file.size);
  d.querySelector('[data-dl]').addEventListener('click', function(){ save(it); });
  d.querySelector('[data-rm]').addEventListener('click', function(){ remove(it.id); });
  list.appendChild(d);
}
function paint(it){
  var d=$('row'+it.id); if(!d) return;
  var st=d.querySelector('.state'), sz=d.querySelector('.sz'), tg=d.querySelector('.tags');

  if(it.info){
    tg.innerHTML='';
    var f=it.info.found.slice();
    if(it.info.alpha && opt.alpha==='flat') f.push('투명 영역');
    if(f.length){
      f.forEach(function(x){
        var s=document.createElement('span'); s.className='tag'; s.textContent=x; tg.appendChild(s);
      });
    } else {
      var s2=document.createElement('span'); s2.className='tag none'; s2.textContent='딸린 정보 없음'; tg.appendChild(s2);
    }
  }

  if(it.state==='wait'){ st.className='state s-wait'; st.textContent='대기'; }
  if(it.state==='work'){ st.className='state s-work'; st.textContent='지우는 중'; }
  if(it.state==='fail'){ st.className='state s-fail'; st.textContent='실패'; sz.textContent=it.err||'실패'; }
  if(it.state==='done'){
    st.className='state s-done'; st.textContent='완료';
    sz.innerHTML=size(it.file.size)+'<i>→</i>'+size(it.outSize)+
      ' ('+Math.round(it.outSize/it.file.size*100)+'%)';
    d.querySelector('[data-dl]').disabled=false;
  }
}
function remove(id){
  for(var i=0;i<items.length;i++){
    if(items[i].id===id){
      URL.revokeObjectURL(items[i].url);
      items.splice(i,1);
      var d=$('row'+id); if(d) d.remove();
      break;
    }
  }
  sync();
}
$('clear').addEventListener('click', function(){
  items.forEach(function(x){ URL.revokeObjectURL(x.url); });
  items=[];
  list.innerHTML=''; list.appendChild(empty);
  sync();
});

function mime(f){ return f==='jpg'?'image/jpeg':f==='webp'?'image/webp':'image/png'; }

function clean(it){
  return new Promise(function(done){
    it.state='work'; paint(it);
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth, h=img.naturalHeight;

        if($('doResize').checked){
          var mx=Math.max(200, Math.min(8000, parseInt($('maxSide').value,10)||1600));
          var long=Math.max(w,h);
          if(long>mx){ var k=mx/long; w=Math.round(w*k); h=Math.round(h*k); }
        }

        var c=document.createElement('canvas');
        c.width=w; c.height=h;
        var ctx=c.getContext('2d');
        ctx.imageSmoothingEnabled=true;
        if(ctx.imageSmoothingQuality!==undefined) ctx.imageSmoothingQuality='high';

        var flat=(opt.alpha==='flat') || opt.fmt==='jpg';
        if(flat){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img,0,0,w,h);

        if(flat){
          // 알파값을 전부 불투명으로 — 투명 영역에 숨긴 기록이 여기서 깨진다
          var d=ctx.getImageData(0,0,w,h), a=d.data;
          for(var i=3;i<a.length;i+=4) a[i]=255;
          ctx.putImageData(d,0,0);
        }

        var type=mime(opt.fmt);
        var q=(opt.fmt==='png') ? undefined : (parseInt($('q').value,10)/100);
        c.toBlob(function(b){
          if(!b){ it.state='fail'; it.err='저장 실패'; paint(it); sync(); done(); return; }
          it.blob=b; it.outSize=b.size;
          it.out=it.file.name.replace(/\.[^.]+$/,'')+'_clean.'+opt.fmt;
          it.state='done'; paint(it); sync(); done();
        }, type, q);
      }catch(e){
        it.state='fail'; it.err='처리 실패'; paint(it); sync(); done();
      }
    };
    img.onerror=function(){ it.state='fail'; it.err='열 수 없는 파일'; paint(it); sync(); done(); };
    img.src=it.url;
  });
}

$('go').addEventListener('click', function(){
  var btn=this, old=btn.textContent;
  btn.disabled=true; btn.textContent='지우는 중…';
  var chain=Promise.resolve();
  items.forEach(function(it){
    chain=chain.then(function(){ if(it.state!=='done') return clean(it); });
  });
  chain.then(function(){ btn.textContent=old; sync(); });
});

/* ===================== 내려받기 ===================== */
function pull(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
}
function save(it){ if(it.blob) pull(it.blob, it.out); }

$('dlzip').addEventListener('click', function(){
  var done=items.filter(function(x){ return x.state==='done'; });
  if(!done.length) return;
  if(done.length===1){ save(done[0]); return; }
  var btn=this, old=btn.textContent;
  btn.disabled=true; btn.textContent='묶는 중…';
  var zip=new JSZip();
  done.forEach(function(it){ zip.file(it.out, it.blob); });
  zip.generateAsync({type:'blob'}).then(function(b){
    pull(b, 'clean.zip');
    btn.textContent=old; sync();
  }).catch(function(){
    btn.textContent=old; sync();
    done.forEach(function(it,i){ setTimeout(function(){ save(it); }, i*300); });
  });
});

/* ===================== 끌어다 놓기 ===================== */
drop.addEventListener('click', function(){ file.click(); });
file.addEventListener('change', function(){ if(file.files.length) add(file.files); file.value=''; });
drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function(){ drop.classList.remove('over'); });
drop.addEventListener('drop', function(e){
  e.preventDefault(); drop.classList.remove('over');
  if(e.dataTransfer.files.length) add(e.dataTransfer.files);
});
window.addEventListener('dragover', function(e){ e.preventDefault(); });
window.addEventListener('drop', function(e){ e.preventDefault(); });

sync();
})();
</script>
</body>
</html>
